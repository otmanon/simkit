name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-lean:
    name: Tests (lean install, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout (with the Eigen submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (numpy + scipy + pytest; builds the C++ extension)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify simkit imports and the C++ backend is active
        run: python -c "import simkit; assert simkit.cpp_available(), 'C++ extension not built'; print(simkit.__name__, 'backend', simkit.backend())"

      - name: Run pytest (C++ backend)
        run: pytest -ra

      - name: Run pytest (NumPy backend)
        run: pytest -ra
        env:
          SIMKIT_BACKEND: python

  pip-install-cross-platform:
    name: pip install (C++ extension, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout (with the Eigen submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip install from the source tree (non-editable, like a user would)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Verify the C++ backend is active from outside the source tree
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c "import simkit; assert simkit.cpp_available(), 'C++ extension not built'; print('backend', simkit.backend(), 'threads', simkit.cpp_num_threads())"

      - name: Run pytest (C++ backend)
        run: pytest -ra

      - name: Run pytest (NumPy backend)
        run: pytest -ra
        env:
          SIMKIT_BACKEND: python

      - name: Build sdist and wheel, install the wheel into a clean venv
        shell: bash
        run: |
          pip install build
          python -m build --sdist --wheel --outdir dist
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/bin/python" ]; then VPY="$RUNNER_TEMP/venv/bin/python"; else VPY="$RUNNER_TEMP/venv/Scripts/python.exe"; fi
          "$VPY" -m pip install --upgrade pip
          "$VPY" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$VPY" -c "import simkit; assert simkit.cpp_available(), 'wheel has no C++ extension'; print('wheel OK')"

  pip-install-no-eigen-submodule:
    name: pip install without the submodule (Eigen download fallback)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the C++ backend built from the downloaded Eigen
        run: python -c "import simkit; assert simkit.cpp_available(), 'C++ extension not built'"

      - name: Run pytest
        run: pytest -ra

  test-pure-python:
    name: Tests (pure Python, no C++ extension)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install without the C++ extension
        run: |
          python -m pip install --upgrade pip
          SIMKIT_NO_CPP=1 pip install -e ".[dev]"

      - name: Verify the NumPy backend is used
        run: python -c "import simkit; assert not simkit.cpp_available(); assert simkit.backend() == 'python'"

      - name: Run pytest
        run: pytest -ra

  test-full:
    name: Tests (full install, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Optional installs (cvxopt, libigl, polyscope, ...) occasionally break
    # on PyPI; don't fail the whole pipeline when that happens.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10","3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System deps for cvxopt
        run: |
          sudo apt-get update
          sudo apt-get install -y libsuitesparse-dev

      - name: Install simkit with all end-user extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mesh,viz,solvers,video,cmaes,dev]"

      - name: Run pytest
        run: pytest -ra

  build-sdist-wheel:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist

      - name: Inspect built distributions
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
